services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:mNG2ZCzkYlfu5ZM56/3Ekm6GAFLLsrg7rrJRvQj4dYQ="   # chave apenas de desenvolvimento
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: projeto_aulas_api
      DB_USERNAME: root
      DB_PASSWORD: secret
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      REACT_APP_API_URL: http://localhost:8000/api

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: projeto_aulas_api
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
